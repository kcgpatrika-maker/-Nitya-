<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>नित्य - Nitya Companion</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #fff7ed 0%, #fef3c7 100%);
            margin: 0;
            padding: 20px;
            color: #292524;
            min-height: 100vh;
        }
        .container {
            max-width: 450px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            padding: 24px;
            border: 1px solid #fde68a;
        }
        .header {
            text-align: center;
            border-bottom: 2px dashed #fcd34d;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .header h1 {
            color: #c2410c;
            margin: 0;
            font-size: 32px;
            letter-spacing: 1px;
        }
        .time-display {
            font-size: 28px;
            font-weight: bold;
            color: #b45309;
            margin-top: 8px;
            font-family: monospace;
        }
        .card {
            background: #fffbeb;
            border-left: 6px solid #f59e0b;
            padding: 16px;
            border-radius: 14px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }
        .card h3 { margin: 0 0 6px 0; color: #92400e; font-size: 18px; }
        .card p { margin: 0; font-size: 15px; color: #78350f; }
        
        .alarm-box {
            background: #fef2f2;
            border: 1px solid #fecaca;
            padding: 14px;
            border-radius: 14px;
            margin-bottom: 20px;
        }
        .alarm-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .alarm-box label { font-weight: bold; color: #991b1b; }
        .alarm-box input[type="time"] { padding: 6px; border-radius: 6px; border: 1px solid #f87171; font-size: 16px; }
        
        .custom-audio-section {
            border-top: 1px dashed #fca5a5;
            padding-top: 10px;
            font-size: 13px;
            color: #7f1d1d;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-size: 17px;
            font-weight: bold;
            color: #fff;
            cursor: pointer;
            margin-bottom: 14px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn:active { transform: scale(0.98); }
        .btn-green { background: linear-gradient(135deg, #16a34a 0%, #15803d 100%); }
        .btn-blue { background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); }
        
        .grid {
            display: flex;
            gap: 12px;
        }
        .sub-card {
            flex: 1;
            padding: 16px;
            background: #fafaf9;
            border-radius: 14px;
            text-align: center;
            border: 1px solid #e7e5e4;
            cursor: pointer;
            transition: 0.2s;
        }
        .sub-card:hover { background: #f5f5f4; }
        .sub-card h4 { margin: 0 0 6px 0; color: #d97706; font-size: 16px; }
        .sub-card small { color: #78716c; font-size: 12px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>नित्य (Nitya)</h1>
        <div class="time-display" id="clock">00:00:00 AM</div>
        <div id="date-string" style="color: #a16207; margin-top: 4px; font-weight: 500;"></div>
    </div>

    <!-- आज का पंचांग -->
    <div class="card">
        <h3>आज का पंचांग</h3>
        <p id="panchang-text">26 सितंबर 2026 | आश्विन शुक्ल पक्ष, पूर्णिमा</p>
    </div>

    <!-- अलार्म सेटिंग्स (ऑटो-सेव + कस्टम ऑडियो) -->
    <div class="alarm-box">
        <div class="alarm-row">
            <label for="alarm-time">⏰ अलार्म समय:</label>
            <input type="time" id="alarm-time" onchange="saveAlarmTime()">
        </div>
        
        <!-- बेटी की आवाज़ या भजन अपलोड करने का सिस्टम -->
        <div class="custom-audio-section">
            <label>🎵 अलार्म टोन (बेटी की आवाज़ / भजन MP3):</label><br>
            <input type="file" id="custom-audio-file" accept="audio/*" onchange="saveAudioFile(event)" style="margin-top: 6px; width: 100%;">
            <audio id="audio-player" style="display:none;"></audio>
            <p id="audio-status" style="margin: 4px 0 0 0; color: #16a34a; font-weight: bold;"></p>
        </div>
    </div>

    <!-- 1. सुबह का बटन -->
    <button class="btn btn-green" onclick="stopAlarmAndSpeak()">
        🌅 मैं उठ गया (Stop Alarm & Panchang)
    </button>

    <!-- 2. समाचार का बटन -->
    <button class="btn btn-blue" onclick="playNews()">
        📰 ताज़ा समाचार (QuickNewsGPT)
    </button>

    <!-- 3. शाम और रात का सेक्शन -->
    <div class="grid">
        <div class="sub-card" onclick="playAarti()">
            <h4>🪔 संध्या आरती</h4>
            <small>दर्शन व मंत्र पाठ</small>
        </div>
        <div class="sub-card" onclick="startNightReflection()">
            <h4>🌙 रात्रि संवाद</h4>
            <small>AI आत्म-विश्लेषण</small>
        </div>
    </div>
</div>

<script>
    let alarmTime = null;
    let customAudioData = null;

    // 1. लोड होते ही सेव किया हुआ अलार्म और ऑडियो वापस लाना
    window.onload = function() {
        const savedTime = localStorage.getItem('nitya_alarm_time');
        if (savedTime) {
            document.getElementById('alarm-time').value = savedTime;
            alarmTime = savedTime;
        }

        const savedAudio = localStorage.getItem('nitya_custom_audio');
        if (savedAudio) {
            customAudioData = savedAudio;
            document.getElementById('audio-player').src = savedAudio;
            document.getElementById('audio-status').innerText = "✓ कस्टम ऑडियो सेव है";
        }

        updateClock();
    };

    // 2. लाइव घड़ी और अलार्म चेक
    function updateClock() {
        const now = new Date();
        const timeString = now.toLocaleTimeString('en-US', { hour12: true });
        const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        
        document.getElementById('clock').innerText = timeString;
        document.getElementById('date-string').innerText = now.toLocaleDateString('hi-IN', dateOptions);

        // अलार्म बजाना
        const currentHoursMinutes = now.toTimeString().substring(0, 5);
        if (alarmTime && currentHoursMinutes === alarmTime && now.getSeconds() === 0) {
            triggerAlarm();
        }
    }
    setInterval(updateClock, 1000);

    // 3. अलार्म टाइम याद (Save) रखना
    function saveAlarmTime() {
        alarmTime = document.getElementById('alarm-time').value;
        localStorage.setItem('nitya_alarm_time', alarmTime);
        speakText("सुबह " + alarmTime + " बजे का अलार्म सुरक्षित कर दिया गया है।");
    }

    // 4. बेटी/परिवार की रिकॉर्डिंग या भजन सेव करना
    function saveAudioFile(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                customAudioData = e.target.result;
                document.getElementById('audio-player').src = customAudioData;
                localStorage.setItem('nitya_custom_audio', customAudioData);
                document.getElementById('audio-status').innerText = "✓ " + file.name + " सेव हो गया!";
                speakText("आपकी आवाज़ की फ़ाइल अलार्म के लिए सेट हो गई है।");
            };
            reader.readAsDataURL(file);
        }
    }

    // 5. अलार्म ट्रिगर होना
    function triggerAlarm() {
        const player = document.getElementById('audio-player');
        if (customAudioData) {
            player.play(); // कस्टम आवाज़/भजन बजेगा
        } else {
            speakText("शुभ प्रभात! उठने का समय हो गया है। नित्य में आपका स्वागत है।");
        }
    }

    // प्राकृतिक हिंदी आवाज़
    function speakText(text) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'hi-IN';
        msg.rate = 0.9;

        const voices = window.speechSynthesis.getVoices();
        const hindiVoice = voices.find(voice => voice.lang.includes('hi') || voice.lang.includes('HI'));
        if (hindiVoice) msg.voice = hindiVoice;

        window.speechSynthesis.speak(msg);
    }

    // 6. मैं उठ गया (अलार्म बंद करें + पंचांग सुनें)
    function stopAlarmAndSpeak() {
        const player = document.getElementById('audio-player');
        player.pause();
        player.currentTime = 0;

        const panchangText = document.getElementById('panchang-text').innerText;
        speakText("शुभ प्रभात! आप उठ चुके हैं। आज का पंचांग है: " + panchangText + "। आपका दिन मंगलमय रहे।");
    }

    function playNews() {
        speakText("QuickNewsGPT से आपके आज के मुख्य समाचार प्रस्तुत हैं।");
    }

    function playAarti() {
        speakText("संध्या आरती का समय हो चुका है। मन को शांत करके इष्टदेव का ध्यान करें। ओम जय जगदीश हरे...");
    }

    function startNightReflection() {
        const answer = prompt("आज का दिन कैसा रहा? आज आपने ऐसा क्या किया जिससे आपको खुशी मिली?");
        if (answer) {
            speakText("आपकी बात सुनकर बहुत अच्छा लगा। दिनभर के प्रयासों के बाद अब विश्राम का समय है। शुभ रात्रि!");
        }
    }
</script>

</body>
</html>
