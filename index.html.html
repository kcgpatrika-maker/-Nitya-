<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>नित्य - Personal Daily Companion</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #f59e0b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 16px;
        }
        .header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 1px solid #334155;
        }
        .header h1 { color: var(--accent); margin: 0; font-size: 28px; }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin: 16px 0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }
        .card h2 { margin-top: 0; font-size: 18px; color: #38bdf8; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 6px; font-size: 14px; color: var(--text-muted); }
        input[type="time"], input[type="text"], input[type="file"] {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            box-sizing: border-box;
        }
        button {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
        }
        button:active { opacity: 0.8; }
        .status-box {
            background: #0284c7;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>नित्य (Nitya)</h1>
        <p style="color: var(--text-muted); margin: 4px 0 0 0; font-size: 13px;">आपकी व्यक्तिगत दैनिक दिनचर्या सहायक</p>
    </div>

    <div class="status-box" id="statusBox">
        प्रणाली तैयार है... स्वायत्त चक्र सक्रिय।
    </div>

    <!-- 1. प्रभात अलार्म सेटिंग्स -->
    <div class="card">
        <h2>1. प्रभात अलार्म (Morning Routine)</h2>
        <div class="form-group">
            <label>अलार्म का समय (Alarm Time):</label>
            <input type="time" id="morningTime" value="06:00">
        </div>
        <div class="form-group">
            <label>आपकी/बेटी की रिकॉर्डेड लाइन (Alarm Audio):</label>
            <input type="file" id="morningAudio" accept="audio/*">
        </div>
        <button onclick="saveMorningSettings()">मॉर्निंग सेटिंग्स सेव करें</button>
    </div>

    <!-- 2. संध्या आरती सेटिंग्स -->
    <div class="card">
        <h2>2. संध्या आरती (Evening Aarti)</h2>
        <div class="form-group">
            <label>आरती का समय (Aarti Time):</label>
            <input type="time" id="eveningTime" value="18:30">
        </div>
        <div class="form-group">
            <label>भगवान की फोटो (Deity Image):</label>
            <input type="file" id="deityImage" accept="image/*">
        </div>
        <div class="form-group">
            <label>आरती/मंत्र का यूट्यूब लिंक या लोकल ऑडियो:</label>
            <input type="text" id="aartiLink" placeholder="YouTube Link or Audio File Path">
        </div>
        <button onclick="saveEveningSettings()">संध्या सेटिंग्स सेव करें</button>
    </div>

    <!-- 3. रात्रि शयन संवाद सेटिंग्स -->
    <div class="card">
        <h2>3. रात्रि संवाद एवं शयन (Night Reflection)</h2>
        <div class="form-group">
            <label>सोने का समय (Bedtime):</label>
            <input type="time" id="nightTime" value="22:00">
        </div>
        <div class="form-group">
            <label>सोते समय पसंदीदा भजन/संगीत का लिंक:</label>
            <input type="text" id="sleepAudioLink" placeholder="YouTube Link for Lullaby/Bhajan">
        </div>
        <button onclick="saveNightSettings()">रात्रि सेटिंग्स सेव करें</button>
    </div>

    <script>
        // In-Browser / Hybrid App Speech & Engine Controller
        const synth = window.speechSynthesis;

        function speakText(text, callback) {
            if (synth.speaking) synth.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'hi-IN';
            utterance.rate = 0.95; // Natural speed
            utterance.onend = () => { if (callback) callback(); };
            synth.speak(utterance);
        }

        function updateStatus(msg) {
            document.getElementById('statusBox').innerText = msg;
        }

        // 1. Morning Logic Mock Execution
        function triggerMorningFlow() {
            updateStatus("अलार्म ट्रिगर हुआ... 'मैं उठ गया' का इंतज़ार।");
            // Simulate Alarm Audio -> User Clicks 'I am Awake'
            setTimeout(() => {
                const today = new Date();
                const text = `नमस्कार! आज तारीख ${today.getDate()} है। आज आश्विन मास, शुक्ल पक्ष की तिथि और शुभ वार है। आज का दिन मंगलमय हो।`;
                speakText(text, () => {
                    // Step 4 & 6: Ask for news
                    speakText("क्या आज के ताज़ा समाचार सुनाऊँ?", () => {
                        // Auto-fetch News via Google RSS if user stays neutral
                        setTimeout(() => {
                            fetchNewsAndRead();
                        }, 3000);
                    });
                });
            }, 1000);
        }

        // Fetch Live Hindi News Brief (Free Google RSS Feed)
        function fetchNewsAndRead() {
            updateStatus("QuickNewsGPT से ताज़ा समाचार फ़ेच किए जा रहे हैं...");
            // Standard RSS Parsing logic integrated in Android Native Bridge
            const mockNews = "QuickNewsGPT से आज की मुख्य सुर्खियाँ: देश में विकास कार्यों में तेज़ी, मौसम विभाग ने जारी किया अलर्ट, और खेल जगत से भारत की शानदार जीत।";
            speakText(mockNews);
        }

        // Settings Saver (Stores locally in Device Memory)
        function saveMorningSettings() {
            localStorage.setItem('morningTime', document.getElementById('morningTime').value);
            alert("मॉर्निंग अलार्म सेटिंग्स सेव हो गईं!");
        }

        function saveEveningSettings() {
            localStorage.setItem('eveningTime', document.getElementById('eveningTime').value);
            localStorage.setItem('aartiLink', document.getElementById('aartiLink').value);
            alert("संध्या आरती सेटिंग्स सेव हो गईं!");
        }

        function saveNightSettings() {
            localStorage.setItem('nightTime', document.getElementById('nightTime').value);
            localStorage.setItem('sleepAudioLink', document.getElementById('sleepAudioLink').value);
            alert("रात्रि संवाद सेटिंग्स सेव हो गईं!");
        }
    </script>
</body>
</html>
