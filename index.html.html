<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nitya - आपकी दिनचर्या का साथी</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #f59e0b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 16px;
        }
        .header {
            text-align: center;
            padding: 24px 0 16px 0;
            border-bottom: 1px solid #334155;
        }
        .header h1 { 
            color: var(--accent); 
            margin: 0; 
            font-size: 32px; 
            letter-spacing: 1px;
        }
        .header .tagline {
            color: #38bdf8;
            margin: 8px 0 0 0;
            font-size: 20px;
            font-weight: 600;
        }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin: 16px 0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }
        .card h2 { margin-top: 0; font-size: 18px; color: #38bdf8; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 6px; font-size: 14px; color: var(--text-muted); }
        input[type="time"], input[type="date"], input[type="text"], input[type="file"] {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            box-sizing: border-box;
        }
        button {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
        }
        button:active { opacity: 0.8; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Nitya</h1>
        <div class="tagline">आपकी दिनचर्या का साथी</div>
    </div>

    <!-- 1. प्रभात अलार्म सेटिंग्स -->
    <div class="card">
        <h2>1. प्रभात अलार्म (Morning Routine)</h2>
        <div class="form-group">
            <label>अलार्म का समय (Alarm Time):</label>
            <input type="time" id="morningTime" value="06:00">
        </div>
        <div class="form-group">
            <label>परिवार के सदस्य की आवाज रिकॉर्ड करें:</label>
            <input type="file" id="morningAudio" accept="audio/*">
        </div>
        <button onclick="saveMorningSettings()">मॉर्निंग सेटिंग्स सेव करें</button>
    </div>

    <!-- 2. संध्या आरती सेटिंग्स -->
    <div class="card">
        <h2>2. संध्या आरती (Evening Aarti)</h2>
        <div class="form-group">
            <label>आरती का समय (Aarti Time):</label>
            <input type="time" id="eveningTime" value="18:30">
        </div>
        <div class="form-group">
            <label>भगवान की फोटो अपलोड करें:</label>
            <input type="file" id="deityImage" accept="image/*">
        </div>
        <div class="form-group">
            <label>आरती/मंत्र का यूट्यूब लिंक या लोकल ऑडियो:</label>
            <input type="text" id="aartiLink" placeholder="यूट्यूब लिंक या ऑडियो फाइल का पाथ लिखें">
        </div>
        <button onclick="saveEveningSettings()">संध्या सेटिंग्स सेव करें</button>
    </div>

    <!-- 3. महत्वपूर्ण रिमाइंडर (कैलेंडर एवं वॉयस) -->
    <div class="card">
        <h2>3. महत्वपूर्ण रिमाइंडर (Reminder)</h2>
        <div class="form-group">
            <label>तारीख और समय चुनें:</label>
            <input type="date" id="reminderDate">
            <input type="time" id="reminderTime" style="margin-top: 6px;">
        </div>
        <div class="form-group">
            <label>रिमाइंडर सन्देश (या बोलकर रिकॉर्ड करें):</label>
            <input type="text" id="reminderText" placeholder="जैसे: दीदी को कॉल करना है / बर्थडे विश करना है">
        </div>
        <button onclick="saveReminder()">रिमाइंडर सेट करें</button>
    </div>

    <!-- 4. रात्रि शयन संवाद सेटिंग्स -->
    <div class="card">
        <h2>4. रात्रि संवाद एवं शयन (Night Reflection)</h2>
        <div class="form-group">
            <label>सोने का समय (Bedtime):</label>
            <input type="time" id="nightTime" value="22:00">
        </div>
        <div class="form-group">
            <label>सोते समय पसंदीदा भजन/संगीत का लिंक:</label>
            <input type="text" id="sleepAudioLink" placeholder="यूट्यूब लिंक या ऑडियो फाइल का पाथ लिखें">
        </div>
        <button onclick="saveNightSettings()">रात्रि सेटिंग्स सेव करें</button>
    </div>

    <script>
        function saveMorningSettings() {
            localStorage.setItem('morningTime', document.getElementById('morningTime').value);
            alert("मॉर्निंग अलार्म सेटिंग्स सेव हो गईं!");
        }

        function saveEveningSettings() {
            localStorage.setItem('eveningTime', document.getElementById('eveningTime').value);
            localStorage.setItem('aartiLink', document.getElementById('aartiLink').value);
            alert("संध्या आरती सेटिंग्स सेव हो गईं!");
        }

        function saveReminder() {
            const date = document.getElementById('reminderDate').value;
            const time = document.getElementById('reminderTime').value;
            const text = document.getElementById('reminderText').value;
            if(!date || !time || !text) {
                alert("कृपया तारीख, समय और रिमाइंडर सन्देश पूरा भरें।");
                return;
            }
            alert("रिमाइंडर सफलतापूर्वक सेट हो गया है!");
        }

        function saveNightSettings() {
            localStorage.setItem('nightTime', document.getElementById('nightTime').value);
            localStorage.setItem('sleepAudioLink', document.getElementById('sleepAudioLink').value);
            alert("रात्रि संवाद सेटिंग्स सेव हो गईं!");
        }
    </script>
</body>
</html>
