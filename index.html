<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nitya - आपकी दिनचर्या का साथी</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #f59e0b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 16px;
        }
        .header {
            text-align: center;
            padding: 24px 0 16px 0;
            border-bottom: 1px solid #334155;
        }
        .header h1 { 
            color: var(--accent); 
            margin: 0; 
            font-size: 32px; 
            letter-spacing: 1px;
        }
        .header .tagline {
            color: #38bdf8;
            margin: 8px 0 0 0;
            font-size: 20px;
            font-weight: 600;
        }
        .pwa-banner {
            background: #0284c7;
            color: white;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 16px;
            display: none;
        }
        .pwa-btn {
            background: #ffffff;
            color: #0284c7;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            margin-top: 8px;
            cursor: pointer;
        }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin: 16px 0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }
        .card h2 { margin-top: 0; font-size: 18px; color: #38bdf8; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 6px; font-size: 14px; color: var(--text-muted); }
        input[type="time"], input[type="date"], input[type="text"], input[type="file"] {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            box-sizing: border-box;
        }
        button.save-btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Nitya</h1>
        <div class="tagline">आपकी दिनचर्या का साथी</div>
    </div>

    <!-- PWA Install Banner -->
    <div id="pwaBanner" class="pwa-banner">
        <span>Nitya को अपने फोन में ऐप की तरह जोड़ें!</span><br>
        <button class="pwa-btn" onclick="installPWA()">होम स्क्रीन पर जोड़ें (Add to Home Screen)</button>
    </div>

    <!-- 1. प्रभात अलार्म सेटिंग्स -->
    <div class="card">
        <h2>1. प्रभात अलार्म (Morning Routine)</h2>
        <div class="form-group">
            <label>अलार्म का समय (Alarm Time):</label>
            <input type="time" id="morningTime" value="06:00">
        </div>
        <div class="form-group">
            <label>परिवार के सदस्य की आवाज रिकॉर्ड करें:</label>
            <input type="file" id="morningAudio" accept="audio/*">
        </div>
        <button class="save-btn" onclick="saveMorningSettings()">मॉर्निंग सेटिंग्स सेव करें</button>
    </div>

    <!-- 2. संध्या आरती सेटिंग्स -->
    <div class="card">
        <h2>2. संध्या आरती (Evening Aarti)</h2>
        <div class="form-group">
            <label>आरती का समय (Aarti Time):</label>
            <input type="time" id="eveningTime" value="18:30">
        </div>
        <div class="form-group">
            <label>भगवान की फोटो अपलोड करें:</label>
            <input type="file" id="deityImage" accept="image/*">
        </div>
        <div class="form-group">
            <label>आरती/मंत्र का यूट्यूब लिंक या लोकल ऑडियो:</label>
            <input type="text" id="aartiLink" placeholder="यूट्यूब लिंक या ऑडियो फाइल का पाथ लिखें">
        </div>
        <button class="save-btn" onclick="saveEveningSettings()">संध्या सेटिंग्स सेव करें</button>
    </div>

    <!-- 3. महत्वपूर्ण रिमाइंडर -->
    <div class="card">
        <h2>3. महत्वपूर्ण रिमाइंडर (Reminder)</h2>
        <div class="form-group">
            <label>तारीख और समय चुनें:</label>
            <input type="date" id="reminderDate">
            <input type="time" id="reminderTime" style="margin-top: 6px;">
        </div>
        <div class="form-group">
            <label>रिमाइंडर सन्देश (या बोलकर रिकॉर्ड करें):</label>
            <input type="text" id="reminderText" placeholder="जैसे: दीदी को कॉल करना है / बर्थडे विश करना है">
        </div>
        <button class="save-btn" onclick="saveReminder()">रिमाइंडर सेट करें</button>
    </div>

    <!-- 4. रात्रि शयन संवाद सेटिंग्स -->
    <div class="card">
        <h2>4. रात्रि संवाद एवं शयन (Night Reflection)</h2>
        <div class="form-group">
            <label>सोने का समय (Bedtime):</label>
            <input type="time" id="nightTime" value="22:00">
        </div>
        <div class="form-group">
            <label>सोते समय पसंदीदा भजन/संगीत का लिंक:</label>
            <input type="text" id="sleepAudioLink" placeholder="यूट्यूब लिंक या ऑडियो फाइल का पाथ लिखें">
        </div>
        <button class="save-btn" onclick="saveNightSettings()">रात्रि सेटिंग्स सेव करें</button>
    </div>
    <script>
        // 1. PWA Install Prompt Logic
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('pwaBanner').style.display = 'block';
        });

        function installPWA() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        document.getElementById('pwaBanner').style.display = 'none';
                    }
                    deferredPrompt = null;
                });
            }
        }

        // 2. पेज लोड होते ही पुराना सेव डेटा वापस दिखाएँ (Auto-Load on Refresh)
        window.addEventListener('DOMContentLoaded', () => {
            if(localStorage.getItem('morningTime')) {
                document.getElementById('morningTime').value = localStorage.getItem('morningTime');
            }
            if(localStorage.getItem('eveningTime')) {
                document.getElementById('eveningTime').value = localStorage.getItem('eveningTime');
            }
            if(localStorage.getItem('aartiLink')) {
                document.getElementById('aartiLink').value = localStorage.getItem('aartiLink');
            }
            if(localStorage.getItem('reminderDate')) {
                document.getElementById('reminderDate').value = localStorage.getItem('reminderDate');
            }
            if(localStorage.getItem('reminderTime')) {
                document.getElementById('reminderTime').value = localStorage.getItem('reminderTime');
            }
            if(localStorage.getItem('reminderText')) {
                document.getElementById('reminderText').value = localStorage.getItem('reminderText');
            }
            if(localStorage.getItem('nightTime')) {
                document.getElementById('nightTime').value = localStorage.getItem('nightTime');
            }
            if(localStorage.getItem('sleepAudioLink')) {
                document.getElementById('sleepAudioLink').value = localStorage.getItem('sleepAudioLink');
            }
        });

        // 3. डेटा सेव करने के फंक्शन्स
        function saveMorningSettings() {
            const time = document.getElementById('morningTime').value;
            localStorage.setItem('morningTime', time);
            alert("प्रभात अलार्म समय (" + time + ") सेव हो गया है!");
        }

        function saveEveningSettings() {
            const time = document.getElementById('eveningTime').value;
            const link = document.getElementById('aartiLink').value;
            localStorage.setItem('eveningTime', time);
            localStorage.setItem('aartiLink', link);
            alert("संध्या आरती समय (" + time + ") सेव हो गया है!");
        }

        function saveReminder() {
            const date = document.getElementById('reminderDate').value;
            const time = document.getElementById('reminderTime').value;
            const text = document.getElementById('reminderText').value;

            if(!date || !time || !text) {
                alert("कृपया तारीख, समय और संदेश पूरा भरें।");
                return;
            }

            localStorage.setItem('reminderDate', date);
            localStorage.setItem('reminderTime', time);
            localStorage.setItem('reminderText', text);
            alert("रिमाइंडर सफलतापूर्वक सेव हो गया है!");
        }

        function saveNightSettings() {
            const time = document.getElementById('nightTime').value;
            const link = document.getElementById('sleepAudioLink').value;
            localStorage.setItem('nightTime', time);
            localStorage.setItem('sleepAudioLink', link);
            alert("रात्रि संवाद समय (" + time + ") सेव हो गया है!");
        }
    </script>

</body>
</html>
