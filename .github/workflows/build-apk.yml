name: Build Nitya Android APK

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Capacitor & Dependencies
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Locate and Create Web Asset Directory
        run: |
          mkdir -p www
          FILE=$(find . -maxdepth 2 -iname "index.html" | head -n 1)
          if [ -n "$FILE" ]; then
            echo "Found HTML file at: $FILE"
            cp "$FILE" www/index.html
          else
            echo "Error: index.html file not found!"
            exit 1
          fi

      - name: Initialize Capacitor
        run: |
          npx cap init Nitya com.nitya.assistant --web-dir www

      - name: Add Android Platform
        run: |
          npx cap add android

      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nitya-Test-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
